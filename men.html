<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Clothing</title>
    <link rel="stylesheet" href="men.css">
</head>
<body>
    <header>
        <h1>Men's Clothing</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <section class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Men's T-Shirt">
                <h2>Men's T-Shirt</h2>
                <p>$25.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Men's Jeans">
                <h2>Men's Jeans</h2>
                <p>$50.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Men's Jacket">
                <h2>Men's Jacket</h2>
                <p>$75.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Men's Shoes">
                <h2>Men's Shoes</h2>
                <p>$100.00</p>
                <button>Add to Cart</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Jules' Clothing Store</p>
    </footer>
</body>
</html>
