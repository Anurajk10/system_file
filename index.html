<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title-card">
            <h1>Sign Text</h1>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-header">
                <h2>1. Text and Logo</h2>
            </div>
            <div class="card-body">
                <label for="sign-text">Sign Text</label>
                <input type="text" id="sign-text" placeholder="Enter Signage Text...">
                <label for="sign-font">Sign Font</label>
                <select id="sign-font">
                    <option>Arial</option>
                    <option>Verdana</option>
                    <option>Times New Roman</option>
                </select>
                <label for="sign-logo">Sign Logo</label>
                <select id="sign-logo">
                    <option>No Logo</option>
                    <option>Yes Logo</option>
                </select>
                <label for="logo-size">Logo Size (cm)</label>
                <select id="logo-size" disabled>
                    <option>40x40</option>
                    <option>50x50</option>
                    <option>60x60</option>
                </select>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>2. Select Letter</h2>
            </div>
            <div class="card-body">
                <label for="letter-type">Letter Type</label>
                <select id="letter-type">
                    <option>Lighted</option>
                    <option>Non-Lighted</option>
                </select>
                <label for="letter-material">Letter Material</label>
                <select id="letter-material">
                    <option>Plexiglass</option>
                    <option>Acrylic</option>
                    <option>Metal</option>
                </select>
                <label for="letter-height">Letter Height</label>
                <select id="letter-height">
                    <option>20 cm</option>
                    <option>30 cm</option>
                    <option>40 cm</option>
                </select>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>3. Select Floor</h2>
            </div>
            <div class="card-body">
                <label for="floor-type">Select Floor</label>
                <select id="floor-type">
                    <option>No Floor</option>
                    <option>Indoor</option>
                    <option>Outdoor</option>
                </select>
                <label for="floor-width">Width (meters)</label>
                <input type="number" id="floor-width" value="1" disabled>
                <label for="floor-height">Height (meters)</label>
                <input type="number" id="floor-height" value="1" disabled>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>4. Price</h2>
            </div>
            <div class="card-body price-card">
                <ul id="price-breakdown">
                    <li>Floor: €0</li>
                    <li>Letter: €0</li>
                    <li>Logo: €0</li>
                </ul>
                <div class="total-price">
                    <p>Price: <span id="total-price">0 €</span></p>
                </div>
                <button id="create-order">
                    <img src="shopping-cart.png" alt="Shopping Cart" width="20" height="20"/>
                    CREATE ORDER
                </button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
